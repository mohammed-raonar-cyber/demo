<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vintage Pixel Heart</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top left, rgba(173, 216, 255, 0.65), transparent 28%),
                  linear-gradient(180deg, #0027c6 0%, #0047ff 46%, #1165ff 100%);
      overflow: hidden;
      position: relative;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 100% 6px;
      opacity: 0.32;
      pointer-events: none;
    }
    .heart {
      max-width: 260px;
      width: 80vw;
      height: auto;
      display: block;
      animation: beat 0.92s ease-in-out infinite;
      image-rendering: pixelated;
      transform-origin: center center;
      filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.22));
      border: 3px solid rgba(255,255,255,0.18);
      border-radius: 18px;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      18% { transform: scale(1.12); }
      45% { transform: scale(0.98); }
      72% { transform: scale(1.06); }
    }
    @media (max-width: 520px) {
      .heart {
        max-width: 200px;
        width: 88vw;
        border-width: 2px;
      }
    }
  </style>
</head>
<body>
  <img class="heart" src="images-removebg-preview.png" alt="Heart" />
</body>
</html>
